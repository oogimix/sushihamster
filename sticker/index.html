<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタンプ撮影スタジオ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Bagel+Fat+One&family=Titan+One&family=Chewy&family=Fredoka:wght@700&family=Baloo+2:wght@800&family=Sniglet:wght@800&family=Lilita+One&family=Rubik+Bubbles&family=Pacifico&family=Caveat:wght@700&family=Gochi+Hand&family=Mochiy+Pop+One&family=Dela+Gothic+One&family=Potta+One&family=M+PLUS+Rounded+1c:wght@800;900&family=Zen+Maru+Gothic:wght@900&family=Kosugi+Maru&family=Hachi+Maru+Pop&family=Yusei+Magic&family=Darumadrop+One&family=RocknRoll+One&family=Kiwi+Maru:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4f8; --panel:#ffffff; --ink:#4a2a3a; --sub:#9a7a8a; --line:#f3d2df;
  --accent:#ff6fa3; --accent-d:#e24f86; --accent-l:#ffe3ee; --ok:#2eaa6a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",Meiryo,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:2px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-family:"Mochiy Pop One",sans-serif;color:var(--accent-d)}
header .sp{flex:1}
header small{color:var(--sub)}
button{font:inherit;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
button.primary:hover{background:var(--accent-d)}
button.on{background:var(--accent-l);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);padding:16px}}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage-wrap{position:relative;width:100%;max-width:740px;margin:0 auto;aspect-ratio:370/320;border-radius:14px;overflow:hidden;
  border:2px solid var(--line);touch-action:none;background-color:#fff}
.stage-wrap.bg-checker{background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.stage-wrap.bg-line{background:#8ca5c6}
.stage-wrap.bg-dark{background:#1e1e24}
.stage-wrap.bg-white{background:#fff}
#stage{width:100%;height:100%;display:block}
#guide{position:absolute;inset:0;pointer-events:none}
.drop-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);pointer-events:none;padding:20px;line-height:1.8}
.stage-wrap.dragover{outline:4px dashed var(--accent);outline-offset:-8px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.toolbar .lbl{color:var(--sub);font-size:12px}
.status{text-align:center;color:var(--sub);font-size:12px;min-height:1.4em}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 90px);position:sticky;top:12px}
@media (max-width:900px){.panel{max-height:none;position:static}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:2px solid var(--line)}
.tabs button{padding:5px 9px;font-size:13px}
.tab-body{padding:12px;overflow:auto;flex:1}
.sec{margin:0 0 14px}
.sec h3{font-size:13px;margin:0 0 8px;color:var(--accent-d)}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row label{flex:0 0 96px;font-size:12px;color:var(--sub)}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row .val{flex:0 0 42px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.row select,.row input[type=text],.row textarea{flex:1;min-width:0;font:inherit;padding:5px 6px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row textarea{resize:vertical;min-height:52px;font-size:16px}
.row input[type=color]{width:40px;height:28px;border:none;background:none;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.btns button{font-size:12px;padding:5px 8px}
.list{display:flex;flex-direction:column;gap:4px}
.list .item{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.list .item.sel{border-color:var(--accent);background:var(--accent-l)}
.list .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.slots-bar{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.slots-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.slots-head .cnt{font-weight:800;color:var(--accent-d)}
.slots-head .sp{flex:1}
.slots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.slot{flex:0 0 auto;width:96px;border:2px solid var(--line);border-radius:10px;cursor:pointer;position:relative;background-color:#fff;
  background-image:linear-gradient(45deg,#f2f2f2 25%,transparent 25%),linear-gradient(-45deg,#f2f2f2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f2f2f2 75%),linear-gradient(-45deg,transparent 75%,#f2f2f2 75%);
  background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}
.slot img{width:100%;aspect-ratio:370/320;display:block;object-fit:contain}
.slot .no{position:absolute;left:4px;top:2px;font-size:11px;font-weight:800;color:var(--accent-d);text-shadow:0 0 3px #fff,0 0 3px #fff}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-l)}
.progress{position:fixed;inset:0;background:rgba(255,244,248,.85);display:none;align-items:center;justify-content:center;z-index:50;font-size:18px;font-weight:800;color:var(--accent-d)}
.progress.show{display:flex}
input[type=file]{display:none}
</style>
<script src="lib/vendor.js"></script>
</head>
<body>
<header>
  <h1>🍣 スタンプ撮影スタジオ</h1>
  <small>VRM / GLB を読み込んで LINE スタンプ用 PNG を量産</small>
  <span class="sp"></span>
  <button id="btnProjSave">プロジェクト保存</button>
  <button id="btnProjLoad">プロジェクト読込</button>
  <input type="file" id="projFile" accept=".json,application/json">
</header>

<main>
  <div class="stage-col">
    <div class="stage-wrap bg-checker" id="stageWrap">
      <canvas id="stage" width="740" height="640"></canvas>
      <canvas id="guide" width="740" height="640"></canvas>
      <div class="drop-hint" id="dropHint">右の「モデル」タブで「📁 モデルフォルダを開く」を押すか、<br>.vrm / .glb ファイルをここにドロップしてね</div>
    </div>
    <div class="toolbar">
      <span class="lbl">背景プレビュー</span>
      <button data-bg="checker" class="on">透過</button>
      <button data-bg="white">白</button>
      <button data-bg="line">トーク画面</button>
      <button data-bg="dark">ダーク</button>
      <span class="lbl">｜</span>
      <button id="btnGuide" class="on">余白ガイド</button>
      <button id="btnSnap" class="primary">このスタンプをPNG保存</button>
    </div>
    <div class="status" id="status">ドラッグで回転・右ドラッグで移動・ホイールでズーム。文字はドラッグで移動できます。</div>
    <div class="slots-bar">
      <div class="slots-head">
        <span>スタンプ一覧</span><span class="cnt" id="slotCount">1</span>
        <span class="note" id="slotHint"></span>
        <span class="sp"></span>
        <button id="slotNew" class="primary">＋ 複製して新規</button>
        <button id="slotLeft">←</button>
        <button id="slotRight">→</button>
        <button id="slotDel">削除</button>
      </div>
      <div class="slots" id="slots"></div>
    </div>
  </div>

  <aside class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="model" class="on">モデル</button>
      <button data-tab="pose">ポーズ</button>
      <button data-tab="face">表情</button>
      <button data-tab="camera">カメラ・ライト</button>
      <button data-tab="text">文字</button>
      <button data-tab="export">書き出し</button>
    </div>
    <div class="tab-body" id="tabBody"></div>
  </aside>
</main>
<input type="file" id="modelFile" accept=".vrm,.glb" multiple>
<input type="file" id="folderInput" webkitdirectory multiple>
<div class="progress" id="progress">処理中…</div>

<script>
(() => {
// three.js / three-vrm / JSZip は lib/vendor.js に同梱（ダブルクリックで開いてもオフラインで動く）
const { THREE, GLTFLoader, OrbitControls, VRMLoaderPlugin, JSZip } = window.Vendor;
const IS_FILE = location.protocol === 'file:';

// ===== 定数 =====
const W = 370, H = 320, S = 2, CW = W * S, CH = H * S;   // LINEスタンプ最大サイズ×2で内部描画
const MARGIN = 10;                                        // LINE推奨余白
const D2R = Math.PI / 180;
const STORE_KEY = 'sushiStickerStudio.v1';
const VALID_COUNTS = [8, 16, 24, 32, 40];

// 新しいモデルはここに追加すると「プリセット」に並ぶ（game/vrm/ に置いた場合）
const PRESETS = [
  { name: 'sushihamster', url: '../game/vrm/shin_sushihamster.vrm' },
  { name: 'sushifairy',   url: '../game/vrm/shin_sushifairy.vrm' },
];

// 3D文字のフォント（ふくらませる前提で、太め・丸めのものを中心に）
const FONTS = [
  ['英字：ぷっくり', ['Modak', 'Bagel Fat One', 'Titan One', 'Chewy', 'Fredoka', 'Baloo 2', 'Sniglet', 'Lilita One', 'Rubik Bubbles']],
  ['英字：手書き', ['Pacifico', 'Caveat', 'Gochi Hand']],
  ['日本語', ['Mochiy Pop One', 'Dela Gothic One', 'Potta One', 'M PLUS Rounded 1c', 'Zen Maru Gothic', 'Kosugi Maru',
    'Hachi Maru Pop', 'Yusei Magic', 'Darumadrop One', 'RocknRoll One', 'Kiwi Maru']],
];
const FONT_WEIGHT = { 'Fredoka': 700, 'Baloo 2': 800, 'Sniglet': 800, 'Caveat': 700, 'M PLUS Rounded 1c': 900, 'Zen Maru Gothic': 900, 'Kiwi Maru': 500 };

// 素材プリセット（top/bottom：上下グラデ、rough：ざらつき、metal：金属感、coat：表面コート、irid：虹色、sheen：ふわふわ、env：映り込み）
const MAT_PRESETS = {
  'バルーン':     { top: '#ffc0da', bottom: '#ff5c98', rough: 0.22, metal: 0, coat: 1, irid: 0, sheen: 0, opacity: 1, env: 1 },
  'ホログラム':   { top: '#ffd9ea', bottom: '#ff7eab', rough: 0.12, metal: 0.15, coat: 1, irid: 1, sheen: 0, opacity: 1, env: 1.3 },
  'ブルーホロ':   { top: '#dfe6ff', bottom: '#8d9dff', rough: 0.12, metal: 0.15, coat: 1, irid: 1, sheen: 0, opacity: 1, env: 1.3 },
  'クローム':     { top: '#f6e0ff', bottom: '#b8a2ff', rough: 0.08, metal: 0.75, coat: 1, irid: 1, sheen: 0, opacity: 1, env: 1.6 },
  'ゼリー':       { top: '#effcff', bottom: '#45c3ff', rough: 0.04, metal: 0, coat: 1, irid: 0.3, sheen: 0, opacity: 0.82, env: 1.4 },
  'くも':         { top: '#ffffff', bottom: '#e6eaf3', rough: 0.65, metal: 0, coat: 0.15, irid: 0, sheen: 1, opacity: 1, env: 0.9 },
  'ミント':       { top: '#d4fae6', bottom: '#86dcb6', rough: 0.3, metal: 0, coat: 0.7, irid: 0, sheen: 0, opacity: 1, env: 1 },
  'オレンジ':     { top: '#ffd76e', bottom: '#ff9418', rough: 0.28, metal: 0, coat: 0.8, irid: 0, sheen: 0, opacity: 1, env: 1 },
  'ネオン':       { top: '#ffa6ea', bottom: '#d6007f', rough: 0.1, metal: 0.5, coat: 1, irid: 0.6, sheen: 0, opacity: 1, env: 1.3 },
  'ソーダ':       { top: '#8fe3ff', bottom: '#1b9be6', rough: 0.18, metal: 0, coat: 1, irid: 0, sheen: 0, opacity: 1, env: 1.1 },
};
// ワンタッチ完成スタイル（第一弾スタンプの文字を参考に、フォント・形・加工・素材をまとめて設定）
const TYPE_STYLES = {
  'ホロバルーン':   { ref: 'NO',       font: 'Fredoka', thick: 0.035, round: 0.02, fx: 'none', puff: 1.1, spacing: -0.06, mat: 'ホログラム' },
  'ブルーホロ':     { ref: 'OK',       font: 'Fredoka', thick: 0.035, round: 0.02, fx: 'none', puff: 1.1, spacing: -0.06, mat: 'ブルーホロ' },
  'ぷっくりピンク': { ref: 'Vibes',    jpFont: 'Mochiy Pop One', font: 'Fredoka', thick: 0.05, round: 0.025, fx: 'none', puff: 1, spacing: -0.08, mat: 'バルーン' },
  'もこもこ雲':     { ref: 'GOOD BYE', font: 'Fredoka', thick: 0.03, round: 0.02, fx: 'cloud', fxAmt: 1, puff: 1, spacing: 0.02, mat: 'くも' },
  'リキッドクローム': { ref: 'Tears',  jpFont: 'Yusei Magic', font: 'Caveat', thick: 0.035, round: 0.02, fx: 'none', puff: 1.2, spacing: -0.02, mat: 'クローム' },
  'ネオンチューブ': { ref: 'YO',       font: 'Fredoka', thick: 0, round: 0.01, fx: 'tube', fxAmt: 1, puff: 1, spacing: -0.04, mat: 'ネオン' },
  'したたり':       { ref: 'Yo',       jpFont: 'Yusei Magic', font: 'Gochi Hand', thick: 0.03, round: 0.015, fx: 'drip', fxAmt: 1, puff: 0.9, spacing: 0, mat: 'ミント',
                      top: '#c8f7ee', bottom: '#5fd3c2', rough: 0.45, coat: 0.3 },
  'ぷるぷる泡':     { ref: 'CHEERS',   font: 'Fredoka', thick: 0.03, round: 0.02, fx: 'bubble', fxAmt: 1, puff: 1, spacing: -0.02, mat: 'ゼリー' },
  'とろーんミント': { ref: 'PARTY',    jpFont: 'Yusei Magic', font: 'Caveat', thick: 0.055, round: 0.03, fx: 'none', puff: 1, spacing: 0.04, mat: 'ミント', jitter3d: 15, bounce: 0.08 },
  '和文ポップ':     { ref: '発射',     font: 'Mochiy Pop One', thick: 0.015, round: 0.012, fx: 'none', puff: 1, spacing: -0.03, mat: 'オレンジ' },
  'パステル':       { ref: 'CHU',      font: 'Fredoka', thick: 0.03, round: 0.02, fx: 'none', puff: 1, spacing: -0.02, mat: 'バルーン',
                      top: '#ffe0f0', bottom: '#f5a3cf', rough: 0.5, coat: 0.3 },
};
function applyTypeStyle(L, name) {
  const { ref, mat, ...st } = TYPE_STYLES[name];
  Object.assign(L, { jitter3d: 0, bounce: 0, fxAmt: 1, jpFont: '' }, MAT_PRESETS[mat], { mat, style: name }, st);
}
const FX = [['none', 'なし'], ['cloud', 'くも'], ['drip', 'したたり'], ['bubble', '泡'], ['tube', 'チューブ']];
const SWATCHES = ['#ff5c98', '#ff8fb8', '#ff3b3b', '#ff9418', '#ffd23f', '#a6e34a', '#3ccf8e', '#2ec4d6', '#1b9be6', '#5b6cff',
  '#9b5cff', '#d6007f', '#8a5a44', '#ffffff', '#b8bcc8', '#2b2b35'];
const SHAPE_PRESETS = {
  'くっきり': { thick: 0, round: 0 },
  'ふつう':   { thick: 0.01, round: 0.012 },
  'もちもち': { thick: 0.025, round: 0.02 },
  'とろーん': { thick: 0.05, round: 0.03 },
};

const BONES = [
  ['hips', '腰'], ['spine', '背骨'], ['chest', '胸'], ['upperChest', '上胸'], ['neck', '首'], ['head', '頭'],
  ['leftShoulder', '左肩'], ['leftUpperArm', '左上腕'], ['leftLowerArm', '左ひじ'], ['leftHand', '左手首'],
  ['rightShoulder', '右肩'], ['rightUpperArm', '右上腕'], ['rightLowerArm', '右ひじ'], ['rightHand', '右手首'],
  ['leftUpperLeg', '左もも'], ['leftLowerLeg', '左ひざ'], ['leftFoot', '左足首'],
  ['rightUpperLeg', '右もも'], ['rightLowerLeg', '右ひざ'], ['rightFoot', '右足首'],
];
const FINGERS = ['Index', 'Middle', 'Ring', 'Little'];
const FINGER_JOINTS = ['Proximal', 'Intermediate', 'Distal'];

// ポーズプリセット（度）。左右はキャラ視点
const REST = { leftUpperArm: [0, 0, -70], rightUpperArm: [0, 0, 70] };
const POSE_PRESETS = {
  'きをつけ': { ...REST },
  'Tポーズ': {},
  '手をふる': { leftUpperArm: [0, 0, -70], rightUpperArm: [0, 0, -25], rightLowerArm: [0, 0, -75], rightHand: [0, 0, -10], head: [0, 0, -6] },
  'バンザイ': { leftUpperArm: [0, 0, 65], rightUpperArm: [0, 0, -65], leftLowerArm: [0, 0, 10], rightLowerArm: [0, 0, -10], head: [-8, 0, 0], _gripL: 0, _gripR: 0 },
  'おじぎ': { ...REST, spine: [18, 0, 0], chest: [12, 0, 0], neck: [6, 0, 0], head: [10, 0, 0] },
  'かんがえ中': { leftUpperArm: [0, 0, -70], rightUpperArm: [0, 25, 65], rightLowerArm: [0, 125, 0], head: [6, 0, 10], _gripR: 0.6 },
  'ガッツ': { leftUpperArm: [0, 0, -5], rightUpperArm: [0, 0, 5], leftLowerArm: [0, 0, 100], rightLowerArm: [0, 0, -100], _gripL: 1, _gripR: 1 },
  'びっくり': { leftUpperArm: [0, 0, 25], rightUpperArm: [0, 0, -25], leftLowerArm: [0, 0, 55], rightLowerArm: [0, 0, -55], spine: [-6, 0, 0], head: [-6, 0, 0] },
  'はてな': { ...REST, head: [0, 0, 18], neck: [0, 0, 6], spine: [0, 0, 4] },
  'しょんぼり': { leftUpperArm: [0, 0, -78], rightUpperArm: [0, 0, 78], spine: [10, 0, 0], chest: [8, 0, 0], head: [22, 0, 0] },
  'ぷんぷん': { leftUpperArm: [0, -30, -55], rightUpperArm: [0, 30, 55], leftLowerArm: [0, -110, 0], rightLowerArm: [0, 110, 0], _gripL: 1, _gripR: 1, head: [-4, 0, 0] },
  'ハグ待ち': { leftUpperArm: [0, -45, -30], rightUpperArm: [0, 45, 30], leftLowerArm: [0, -20, 0], rightLowerArm: [0, 20, 0], spine: [6, 0, 0] },
  'ジャンプ': { leftUpperArm: [0, 0, 50], rightUpperArm: [0, 0, -50], leftUpperLeg: [-30, 0, 0], leftLowerLeg: [60, 0, 0], rightUpperLeg: [-10, 0, 0], rightLowerLeg: [30, 0, 0] },
};
const EXPR_PRESETS = {
  'ふつう': {},
  'にっこり': { happy: 1 },
  'ほっこり': { relaxed: 1 },
  'びっくり': { surprised: 1, aa: 0.4 },
  'おこ': { angry: 1 },
  'かなしい': { sad: 1 },
  'ウインク': { happy: 0.5, blinkLeft: 1 },
  'ねむい': { blink: 0.75, relaxed: 0.4 },
  'あ〜': { aa: 1, happy: 0.4 },
};

// ===== 状態 =====
const models = [];            // 読み込み済みモデル（three オブジェクトを持つ）
let selModel = -1;
const state = {
  texts: [],
  selText: 0,
  settings: defaultSettings(),
  slots: [],
  active: 0,
};
let bgMode = 'checker', showGuide = true, tab = 'model', busy = false;
let dirtyTimer = 0, suppressDirty = true;   // 起動処理が終わるまで自動保存しない

// ===== three.js セットアップ =====
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(CW, CH, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
camera.position.set(0, 0.8, 3.2);
const ambLight = new THREE.AmbientLight(0xffffff, 0.9); scene.add(ambLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0); scene.add(keyLight);

const stage = document.getElementById('stage');
const stageCtx = stage.getContext('2d');
const stageWrap = document.getElementById('stageWrap');
const guide = document.getElementById('guide');
const controls = new OrbitControls(camera, stage);
controls.target.set(0, 0.6, 0);
controls.enableDamping = false;
controls.addEventListener('change', () => markDirty());
controls.update();

const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

function defaultSettings() {
  return { outlineW: 0, outlineColor: '#ffffff', amb: 0.9, key: 1.0, keyAz: 30, keyEl: 40, shadow: true };
}
function defaultText(text = 'よろしく') {
  return {
    id: Math.random().toString(36).slice(2, 10), text, font: 'Mochiy Pop One', visible: true,
    size: 0.25, spacing: -0.03, lineH: 1.05, curve: 0, jitter: 0, bounce: 0, jitter3d: 0,

function trimToCanvas(src, maxW, maxH, margin, exact) {
  const sctx = src.getContext('2d');
  const data = sctx.getImageData(0, 0, src.width, src.height).data;
  let x0 = src.width, y0 = src.height, x1 = -1, y1 = -1;
  for (let y = 0; y < src.height; y++) for (let x = 0; x < src.width; x++) {
    if (data[(y * src.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const out = document.createElement('canvas');
  // 端にしっかり色がある＝切れている（影のうっすらした部分は無視）
  const sw = src.width, sh = src.height, A = (x, y) => data[(y * sw + x) * 4 + 3] > 96;
  out.clipped = false;
  for (let x = 0; x < sw && !out.clipped; x++) out.clipped = A(x, 0) || A(x, sh - 1);
  for (let y = 0; y < sh && !out.clipped; y++) out.clipped = A(0, y) || A(sw - 1, y);
  if (x1 < 0) { out.width = exact ? maxW : 2; out.height = exact ? maxH : 2; return out; }
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const sc = Math.min((maxW - margin * 2) / cw, (maxH - margin * 2) / ch);
  const dw = cw * sc, dh = ch * sc;
  out.width = exact ? maxW : Math.min(maxW, Math.ceil((dw + margin * 2) / 2) * 2);
  out.height = exact ? maxH : Math.min(maxH, Math.ceil((dh + margin * 2) / 2) * 2);
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = true; o.imageSmoothingQuality = 'high';
  o.drawImage(src, x0, y0, cw, ch, (out.width - dw) / 2, (out.height - dh) / 2, dw, dh);
  return out;
}
function exportOpts() { return state.exportMode || 'trim'; }
function finalSticker(src) {
  if (exportOpts() === 'trim') return trimToCanvas(src, W, H, MARGIN, false);
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  out.clipped = trimToCanvas(src, 2, 2, 0, true).clipped;
  const o = out.getContext('2d'); o.imageSmoothingQuality = 'high'; o.drawImage(src, 0, 0, W, H);
  return out;
}
const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const work = document.createElement('canvas'); work.width = CW; work.height = CH;
const workCtx = work.getContext('2d', { willReadFrequently: true });
async function renderSlotStill(slot) {

}
function showProgress(t) { const p = document.getElementById('progress'); p.textContent = t; p.classList.add('show'); }

async function withBusy(fn) {

  busy = true;
  try { return await fn(); }
  finally {
    applySlot(state.slots[state.active]);

}
async function exportCurrent() {
  await withBusy(async () => {
    const c = await renderSlotStill(state.slots[state.active]);
    const out = finalSticker(c);
    download(await toBlob(out), `${String(state.active + 1).padStart(2, '0')}.png`);
    setStatus(out.clipped ? '⚠ 画面の端で切れています（ズームアウトするか文字を内側へ）' : 'PNGを保存しました');
  });
}
async function exportZip() {
  await withBusy(async () => {
    const zip = new JSZip();
    const clipped = [];
    for (let i = 0; i < state.slots.length; i++) {
      showProgress(`書き出し中… ${i + 1} / ${state.slots.length}`);
      await new Promise(r => setTimeout(r, 0));
      const c = await renderSlotStill(state.slots[i]);
      const out = finalSticker(c);
      if (out.clipped) clipped.push(i + 1);
      zip.file(`${String(i + 1).padStart(2, '0')}.png`, await toBlob(out));
    }
    const mi = Math.min(state.mainSlot ?? state.active, state.slots.length - 1);
    const c = await renderSlotStill(state.slots[mi]);
    zip.file('main.png', await toBlob(trimToCanvas(c, 240, 240, 0, true)));
    zip.file('tab.png', await toBlob(trimToCanvas(c, 96, 74, 0, true)));
    showProgress('ZIP作成中…');
    download(await zip.generateAsync({ type: 'blob' }), 'line_stickers.zip');
    setStatus(`${state.slots.length}枚 + main.png + tab.png を書き出しました` +

  });
}

function el(tag, attrs = {}, ...kids) {

function slider(label, get, set, min, max, step = 1, fmt = v => v, lazy = false) {
  const val = el('span', { class: 'val' }, String(fmt(get())));
  const inp = el('input', { type: 'range', min, max, step });
  inp.value = get();
  // lazy：重い処理（形の作り直し）は手を離したときだけ

  if (lazy) inp.onchange = apply;

  return el('div', { class: 'row' }, el('label', {}, label), inp, val);
}
function color(label, get, set) {

function select(label, opts, get, set) {

    const [v, t] = Array.isArray(o) ? o : [o, o]; s.append(el('option', { value: v }, t));

function mirrorPose(p) {
  const out = {};

    out[nk] = [v[0], -v[1], -v[2]];
  }
  return out;
}

  });
  const pct = v => Math.round(v * 100) + '%';
  // ワンタッチ配色：選んだ色を下に、明るくした色を上に置いて立体感のあるグラデに
  const lighten = (hex, t) => '#' + new THREE.Color(hex).lerp(new THREE.Color('#ffffff'), t).getHexString();
  const swatches = el('div', { class: 'btns', style: 'margin:8px 0 4px' }, ...SWATCHES.map(c => {
    const b = el('button', { title: c, style: `width:26px;height:26px;padding:0;border-radius:50%;background:radial-gradient(circle at 35% 30%, ${lighten(c, 0.6)}, ${c})` });
    b.onclick = () => { L.bottom = c; L.top = lighten(c, 0.55); renderPanel(); markDirty(); };
    return b;
  }));
  body.append(sec('素材', el('div', { class: 'btns' }, ...matBtns),
    el('p', { class: 'note', style: 'margin:8px 0 0' }, '色だけ変える（素材の質感はそのまま）'),
    swatches,
    color('色 上', () => L.top, v => L.top = v),
    color('色 下', () => L.bottom, v => L.bottom = v),
    el('div', { class: 'btns' },
      btn('上下を入れ替え', () => { [L.top, L.bottom] = [L.bottom, L.top]; renderPanel(); markDirty(); }),
      btn('単色にする', () => { L.top = L.bottom; renderPanel(); markDirty(); })),
    slider('つや', () => 1 - L.rough, v => L.rough = 1 - v, 0, 1, 0.01, pct),
    slider('メタル', () => L.metal, v => L.metal = v, 0, 1, 0.01, pct),
    slider('コーティング', () => L.coat, v => L.coat = v, 0, 1, 0.01, pct),
    slider('虹色', () => L.irid, v => L.irid = v, 0, 1, 0.01, pct),
    slider('ふわふわ', () => L.sheen, v => L.sheen = v, 0, 1, 0.01, pct),
    slider('映り込み', () => L.env, v => L.env = v, 0, 3, 0.05),
    slider('透け', () => 1 - L.opacity, v => L.opacity = 1 - v, 0, 0.8, 0.01, pct)));

  body.append(sec('形（ふくらみ・加工）',
    el('div', { class: 'btns' }, ...Object.entries(SHAPE_PRESETS).map(([k, v]) =>
      btn(k, () => { Object.assign(L, v); renderPanel(); markDirty(); }, L.thick === v.thick && L.round === v.round ? 'on' : ''))),
    el('div', { class: 'btns', style: 'margin-top:6px' }, ...FX.map(([k, t]) =>
      btn(t, () => { L.fx = k; renderPanel(); markDirty(); }, (L.fx || 'none') === k ? 'on' : ''))),
    (L.fx || 'none') !== 'none' ? slider('加工の強さ', () => L.fxAmt ?? 1, v => L.fxAmt = v, 0.3, 2, 0.05, v => v.toFixed(2), true) : null,
    slider('太らせる', () => L.thick, v => L.thick = v, 0, 0.12, 0.0025, v => v.toFixed(3), true),
    slider('角の丸み', () => L.round, v => L.round = v, 0, 0.06, 0.002, v => v.toFixed(3), true),
    slider('ぷっくり', () => L.puff, v => L.puff = v, 0.15, 2, 0.05),
    slider('なめらかさ', () => L.quality, v => L.quality = v, 24, 120, 4, v => v, true),
    el('p', { class: 'note' }, '細いフォントや手書きフォントは「太らせる」を上げると、PARTY や YO のような“とろっとした”文字になります。上げすぎると文字のすき間がつぶれるので注意。')));

  body.append(sec('並び',
    slider('字間', () => L.spacing, v => L.spacing = v, -0.4, 0.6, 0.01),
    slider('行間', () => L.lineH, v => L.lineH = v, 0.6, 2, 0.05),
    slider('アーチ', () => L.curve, v => L.curve = v, -150, 150, 1, v => v + '°'),
    slider('ゆらぎ', () => L.jitter, v => L.jitter = v, 0, 30, 0.5, v => v + '°'),
    slider('はずみ', () => L.bounce, v => L.bounce = v, 0, 0.3, 0.005),
    slider('3Dばらけ', () => L.jitter3d, v => L.jitter3d = v, 0, 45, 1, v => v + '°')));

  const P = L.pos, R = L.rot;
  body.append(sec('位置・向き（ステージ上でドラッグでも動かせます）',
    el('div', { class: 'btns' },
      btn('カメラに向ける', () => { faceCamera(L); renderPanel(); markDirty(); }),
      btn('画面の上へ', () => { placeText(L, 0.55); renderPanel(); markDirty(); }),
      btn('画面の下へ', () => { placeText(L, -0.6); renderPanel(); markDirty(); })),
    slider('左右', () => P[0], v => P[0] = v, -3, 3, 0.005),
    slider('上下', () => P[1], v => P[1] = v, -1, 3, 0.005),
    slider('前後', () => P[2], v => P[2] = v, -3, 3, 0.005),
    slider('傾き X', () => R[0], v => R[0] = v, -180, 180, 1, v => v + '°'),
    slider('向き Y', () => R[1], v => R[1] = v, -180, 180, 1, v => v + '°'),
    slider('回転 Z', () => R[2], v => R[2] = v, -180, 180, 1, v => v + '°'),
    el('p', { class: 'note' }, '「前後」でキャラの後ろに回すと、O の穴からのぞく構図なども作れます。')));
}

function panelExport() {
  body.append(sec('LINEスタンプの書き出し',
    el('p', { class: 'note' }, 'スタンプ画像：最大 370×320px（偶数サイズ・透過PNG・余白10px）。main.png 240×240 と tab.png 96×74 もZIPに入ります。'),
    select('サイズ', [['trim', '余白トリム（推奨）'], ['full', '370×320 固定']], exportOpts, v => state.exportMode = v),
    select('メイン画像', state.slots.map((_, i) => [i, `${i + 1}枚目`]), () => Math.min(state.mainSlot ?? state.active, state.slots.length - 1), v => state.mainSlot = +v),
    el('div', { class: 'btns', style: 'margin-top:8px' },
      btn('いまのスタンプをPNG', exportCurrent),
      btn(`全${state.slots.length}枚をZIPで書き出し`, exportZip, 'primary'))));
  body.append(sec('量産のコツ',
    el('p', { class: 'note' }, '①1枚作ったら「＋複製して新規」→ ②文字とポーズ・表情だけ変える、の繰り返しが早いです。'),
    el('p', { class: 'note' }, 'スタンプ一覧（ポーズ・文字・カメラ）はブラウザに自動保存されます。モデル本体は保存されないので、開き直したら同じモデルを読み込んでください（名前で紐づきます）。'),
    el('p', { class: 'note' }, '別のPCで続きをやる時は「プロジェクト保存」でJSONを持ち出せます。')));
}

// ===== 起動 =====
document.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => {
  bgMode = b.dataset.bg;
  stageWrap.className = 'stage-wrap bg-' + bgMode;
  document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x === b));
});
document.getElementById('btnGuide').onclick = e => { showGuide = !showGuide; e.target.classList.toggle('on', showGuide); };

const saved = loadLocal();
if (saved) {
  state.slots = saved.slots;
  state.active = Math.min(saved.active || 0, saved.slots.length - 1);
  suppressDirty = true; applySlot(state.slots[state.active], false); suppressDirty = false;
  setStatus(`前回のスタンプ一覧（${state.slots.length}枚）を復元しました。モデルを読み込むとポーズも戻ります。`);
} else {
  state.texts = [defaultText()];
  applyLights();
  state.slots = [serialize()];
}
suppressDirty = false;
renderSlots();
renderPanel();
initFolder();
// デバッグ・自動テスト用
window.__studio = { state, models, textGroups, TYPE_STYLES, applyTypeStyle, glyphCache, buildGlyph, fontReady, camera, controls, frameCamera, setAngle, placeText, faceCamera, defaultText, MAT_PRESETS, SHAPE_PRESETS, POSE_PRESETS, settleModel, renderPanel, markDirty };
})();
</script>
</body>
</html>

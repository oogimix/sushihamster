<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタンプ撮影スタジオ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Bagel+Fat+One&family=Titan+One&family=Chewy&family=Fredoka:wght@700&family=Baloo+2:wght@800&family=Sniglet:wght@800&family=Lilita+One&family=Rubik+Bubbles&family=DM+Serif+Display&family=Lobster&family=Yellowtail&family=Monoton&family=Shippori+Mincho+B1:wght@800&family=Press+Start+2P&family=Silkscreen:wght@700&family=VT323&family=Rubik+Glitch&family=Rubik+Iso&family=Rubik+Vinyl&family=Rubik+80s+Fade&family=Rubik+Broken+Fax&family=Bungee&family=Shrikhand&family=Eater&family=Pirata+One&family=Comic+Neue:wght@700&family=Zen+Dots&family=DotGothic16&family=Comfortaa:wght@700&family=Quicksand:wght@700&family=Audiowide&family=Orbitron:wght@800&family=Righteous&family=Pacifico&family=Caveat:wght@700&family=Gochi+Hand&family=Mochiy+Pop+One&family=Dela+Gothic+One&family=Potta+One&family=M+PLUS+Rounded+1c:wght@800;900&family=Zen+Maru+Gothic:wght@900&family=Kosugi+Maru&family=Hachi+Maru+Pop&family=Yusei+Magic&family=Darumadrop+One&family=RocknRoll+One&family=Kiwi+Maru:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4f8; --panel:#ffffff; --ink:#4a2a3a; --sub:#9a7a8a; --line:#f3d2df;
  --accent:#ff6fa3; --accent-d:#e24f86; --accent-l:#ffe3ee; --ok:#2eaa6a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",Meiryo,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:2px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-family:"Mochiy Pop One",sans-serif;color:var(--accent-d)}
header .sp{flex:1}
header small{color:var(--sub)}
button{font:inherit;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
button.primary:hover{background:var(--accent-d)}
button.on{background:var(--accent-l);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);padding:16px}}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage-wrap{position:relative;width:100%;max-width:740px;margin:0 auto;aspect-ratio:370/320;border-radius:14px;overflow:hidden;
  border:2px solid var(--line);touch-action:none;background-color:#fff}
.stage-wrap.bg-checker{background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.stage-wrap.bg-line{background:#8ca5c6}
.stage-wrap.bg-dark{background:#1e1e24}
.stage-wrap.bg-white{background:#fff}
#stage{width:100%;height:100%;display:block}
#guide{position:absolute;inset:0;pointer-events:none}
.drop-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);pointer-events:none;padding:20px;line-height:1.8}
.stage-wrap.dragover{outline:4px dashed var(--accent);outline-offset:-8px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.toolbar .lbl{color:var(--sub);font-size:12px}
.status{text-align:center;color:var(--sub);font-size:12px;min-height:1.4em}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 90px);position:sticky;top:12px}
@media (max-width:900px){.panel{max-height:none;position:static}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:2px solid var(--line)}
.tabs button{padding:5px 9px;font-size:13px}
.tab-body{padding:12px;overflow:auto;flex:1}
.sec{margin:0 0 14px}
.sec h3{font-size:13px;margin:0 0 8px;color:var(--accent-d)}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row label{flex:0 0 96px;font-size:12px;color:var(--sub)}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row .val{flex:0 0 42px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.row select,.row input[type=text],.row textarea{flex:1;min-width:0;font:inherit;padding:5px 6px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row textarea{resize:vertical;min-height:52px;font-size:16px}
.row input[type=color]{width:40px;height:28px;border:none;background:none;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.btns button{font-size:12px;padding:5px 8px}
.list{display:flex;flex-direction:column;gap:4px}
.list .item{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.list .item.sel{border-color:var(--accent);background:var(--accent-l)}
.list .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.slots-bar{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.slots-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.slots-head .cnt{font-weight:800;color:var(--accent-d)}
.slots-head .sp{flex:1}
.slots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.slot{flex:0 0 auto;width:96px;border:2px solid var(--line);border-radius:10px;cursor:pointer;position:relative;background-color:#fff;
  background-image:linear-gradient(45deg,#f2f2f2 25%,transparent 25%),linear-gradient(-45deg,#f2f2f2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f2f2f2 75%),linear-gradient(-45deg,transparent 75%,#f2f2f2 75%);
  background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}
.slot img{width:100%;aspect-ratio:370/320;display:block;object-fit:contain}
.slot .no{position:absolute;left:4px;top:2px;font-size:11px;font-weight:800;color:var(--accent-d);text-shadow:0 0 3px #fff,0 0 3px #fff}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-l)}
.progress{position:fixed;inset:0;background:rgba(255,244,248,.85);display:none;align-items:center;justify-content:center;z-index:50;font-size:18px;font-weight:800;color:var(--accent-d)}
.progress.show{display:flex}
input[type=file]{display:none}
</style>
<script src="lib/vendor.js"></script>
</head>
<body>
<header>
  <h1>🍣 スタンプ撮影スタジオ</h1>
  <small>VRM / GLB を読み込んで LINE スタンプ用 PNG を量産</small>
  <span class="sp"></span>
  <button id="btnProjSave">プロジェクト保存</button>
  <button id="btnProjLoad">プロジェクト読込</button>
  <input type="file" id="projFile" accept=".json,application/json">
</header>

<main>
  <div class="stage-col">
    <div class="stage-wrap bg-checker" id="stageWrap">
      <canvas id="stage" width="740" height="640"></canvas>
      <canvas id="guide" width="740" height="640"></canvas>
      <div class="drop-hint" id="dropHint">右の「モデル」タブで「📁 モデルフォルダを開く」を押すか、<br>.vrm / .glb ファイルをここにドロップしてね</div>
    </div>
    <div class="toolbar">
      <span class="lbl">背景プレビュー</span>
      <button data-bg="checker" class="on">透過</button>
      <button data-bg="white">白</button>
      <button data-bg="line">トーク画面</button>
      <button data-bg="dark">ダーク</button>
      <span class="lbl">｜</span>
      <button id="btnGuide" class="on">余白ガイド</button>
      <button id="btnSnap" class="primary">このスタンプをPNG保存</button>
    </div>
    <div class="status" id="status">ドラッグで回転・右ドラッグで移動・ホイールでズーム。文字はドラッグで移動できます。</div>
    <div class="slots-bar">
      <div class="slots-head">
        <span>スタンプ一覧</span><span class="cnt" id="slotCount">1</span>
        <span class="note" id="slotHint"></span>
        <span class="sp"></span>
        <button id="slotNew" class="primary">＋ 複製して新規</button>
        <button id="slotLeft">←</button>
        <button id="slotRight">→</button>
        <button id="slotDel">削除</button>
      </div>
      <div class="slots" id="slots"></div>
    </div>
  </div>

  <aside class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="model" class="on">モデル</button>
      <button data-tab="pose">ポーズ</button>
      <button data-tab="face">表情</button>
      <button data-tab="camera">カメラ・ライト</button>
      <button data-tab="text">文字</button>
      <button data-tab="anime">アニメ</button>
      <button data-tab="export">書き出し</button>
    </div>
    <div class="tab-body" id="tabBody"></div>
  </aside>
</main>
<input type="file" id="modelFile" accept=".vrm,.glb" multiple>
<input type="file" id="folderInput" webkitdirectory multiple>
<div class="progress" id="progress">処理中…</div>

function setStatus(s) { document.getElementById('status').textContent = s; }
function uniqueName(n) {
  let name = n, k = 2;
  while (models.some(m => m.name === name)) name = `${n}(${k++})`;
  return name;
}
// ダブルクリック起動（file://）では fetch が使えないので、同梱モデルは base64 の .js（models/*.js）経由で読む
async function presetUrl(url) {
  if (!IS_FILE || !url.startsWith('models/')) return url;
  const file = url.slice(7);
  if (!window.__MODELS?.[file]) {
    await new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = url + '.js';
      sc.onload = res; sc.onerror = () => rej(new Error(url + '.js が見つかりません'));
      document.head.appendChild(sc);
    });
  }
  const b64 = window.__MODELS[file];
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return URL.createObjectURL(new Blob([bin]));
}
async function loadModel(url, rawName) {
  setStatus(`${rawName} を読み込み中…`);
  try { url = await presetUrl(url); } catch (e) { setStatus(`読み込み失敗: ${rawName}（${e.message}）`); return; }
  let gltf;
  try {
    gltf = await loader.loadAsync(url, ev => {
      if (ev.total) setStatus(`${rawName} を読み込み中… ${Math.round(ev.loaded / ev.total * 100)}%`);
    });
  } catch (e) {
    console.error(e);
    setStatus(`読み込み失敗: ${rawName}（${e.message || e}）`);
    return;
  }
  const name = uniqueName(rawName);
  const vrm = gltf.userData.vrm || null;
  const obj = vrm ? vrm.scene : gltf.scene;
  obj.traverse(o => { o.frustumCulled = false; });
  // VRM0 は後ろ向きなので向きを揃える（VRMUtils.rotateVRM0 相当）
  if (vrm && vrm.meta?.metaVersion === '0') obj.rotation.y = Math.PI;
  const root = new THREE.Group();
  root.add(obj);
  scene.add(root);
  // 足元を原点に、GLB は身長を 1.4 にそろえる
  let box = preciseBox(obj);
  const size = box.getSize(new THREE.Vector3());
  if (!vrm && size.y > 0) { obj.scale.multiplyScalar(1.4 / size.y); box = preciseBox(obj); }
  const c = box.getCenter(new THREE.Vector3());
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= box.min.y;
  const height = box.max.y - box.min.y;

  let mixer = null, clips = gltf.animations || [];
  if (clips.length) mixer = new THREE.AnimationMixer(obj);
  // GLB用：ボーン一覧と初期ポーズ（ポーズプリセットの土台）
  const bones = new Map(), rest = [];
  if (!vrm) obj.traverse(o => {
    // Bone だけでなく、メッシュを持たない関節ノードも対象（recordolphin は非スキンのリグ）
    if ((o.isBone || (!o.isMesh && o.name && o !== obj)) && !bones.has(o.name)) {
      bones.set(o.name, o); rest.push([o, { p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone() }]);
    }
  });
  const exprNames = vrm?.expressionManager ? vrm.expressionManager.expressions.map(e => e.expressionName) : [];

  const m = { name, root, obj, vrm, vrm0: vrm?.meta?.metaVersion === '0', mixer, clips, bones, rest, action: null, height, exprNames, data: null };
  const saved = state.slots[state.active]?.models?.[name];
  m.data = saved ? { ...defaultModelData(models.length), ...clone(saved) } : defaultModelData(models.length);
  if (!vrm) m.data.pose = {};
  models.push(m);
  selModel = models.length - 1;
  applyModelData(m);
  if (vrm) settleModel(m, 30);
  setupNeta(m);
  applyModelEnv(m);
  document.getElementById('dropHint').style.display = 'none';
  if (!saved) {
    frameCamera('full');   // 新しく出したキャラが画面に入るように
    if (models.length === 1) state.texts.forEach((L, i) => placeText(L, i ? -0.6 : 0.55));
  }
  setStatus(`${name} を読み込みました${vrm ? '（VRM）' : '（GLB）'}`);
  renderPanel();
  markDirty();
}
function removeModel(i) {
  const m = models[i];
  scene.remove(m.root);
  m.root.traverse(o => {
    o.geometry?.dispose();
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    mats.forEach(mt => { Object.values(mt).forEach(v => v?.isTexture && v.dispose()); mt.dispose(); });
  });
  models.splice(i, 1);
  selModel = Math.min(selModel, models.length - 1);
  if (!models.length) document.getElementById('dropHint').style.display = '';
  renderPanel(); markDirty();
}

  if (!/\.(vrm|glb)$/i.test(f.name)) { setStatus(`${f.name} は未対応（.vrm / .glb のみ）`); return; }
  const url = URL.createObjectURL(f);
  try { await loadModel(url, modelNameOf(f.name)); } finally { URL.revokeObjectURL(url); }
}

// Chrome / Edge は File System Access API でフォルダを覚えておき、次回はワンクリックで開ける
let folderName = '', folderFiles = [], savedHandle = null;
const idb = (mode, fn) => new Promise((res, rej) => {
  const rq = indexedDB.open('sushiStickerStudio', 1);
  rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
  rq.onerror = () => rej(rq.error);
  rq.onsuccess = () => {
    const tx = rq.result.transaction('kv', mode);
    const r = fn(tx.objectStore('kv'));
    tx.oncomplete = () => res(r?.result);
    tx.onerror = () => rej(tx.error);
  };
});
const idbGet = k => idb('readonly', st => st.get(k)).catch(() => null);
const idbSet = (k, v) => idb('readwrite', st => st.put(v, k)).catch(() => {});
async function walkDir(dir, depth, out) {
  for await (const [name, entry] of dir.entries()) {
    if (out.length >= 200) return;
    if (entry.kind === 'file' && /\.(vrm|glb)$/i.test(name)) out.push({ name, path: dir.name + '/' + name, get: () => entry.getFile() });
    else if (entry.kind === 'directory' && depth < 3 && !name.startsWith('.') && !/^(node_modules|AppData)$/i.test(name)) await walkDir(entry, depth + 1, out);
  }
}
async function useHandle(h) {
  setStatus(`フォルダ「${h.name}」を探しています…`);
  const out = [];
  await walkDir(h, 0, out);
  setFolder(h.name, out);
}
function setFolder(name, files) {
  folderName = name;
  folderFiles = files.sort((a, b) => a.name.localeCompare(b.name));
  setStatus(folderFiles.length ? `「${name}」に ${folderFiles.length} 個のモデルがあります` : `「${name}」に .vrm / .glb が見つかりませんでした`);
  if (tab !== 'model') showTab('model'); else renderPanel();
  autoLoadUsedModels();
}
// 保存済みスタンプで使っているモデルがフォルダにあれば自動で読み込む
async function autoLoadUsedModels() {
  const used = new Set(state.slots.flatMap(s => Object.keys(s.models || {})));
  for (const f of folderFiles) {
    const nm = modelNameOf(f.name);
    if (used.has(nm) && !models.some(m => m.name === nm)) await loadFile(await f.get());
  }
}
async function openFolder() {
  if (window.showDirectoryPicker) {
    try {
      const h = await window.showDirectoryPicker({ id: 'sticker-models', mode: 'read' });
      savedHandle = h;
      await idbSet('folder', h);
      await useHandle(h);
    } catch (e) {
      if (e.name !== 'AbortError') { console.error(e); document.getElementById('folderInput').click(); }
    }
  } else {
    document.getElementById('folderInput').click();
  }
}
async function reopenFolder() {
  const h = savedHandle;
  if (!h) return;
  try {
    let perm = await h.queryPermission({ mode: 'read' });
    if (perm !== 'granted') perm = await h.requestPermission({ mode: 'read' });
    if (perm !== 'granted') { setStatus('フォルダへのアクセスが許可されませんでした'); return; }
    await useHandle(h);
  } catch (e) {
    console.error(e);
    setStatus('前回のフォルダを開けませんでした。もう一度「モデルフォルダを開く」から選んでね');
  }
}
async function initFolder() {
  if (!window.showDirectoryPicker) return;
  savedHandle = await idbGet('folder');
  if (savedHandle) renderPanel();
}

function trimToCanvas(src, maxW, maxH, margin, exact) {
  const sctx = src.getContext('2d');
  const data = sctx.getImageData(0, 0, src.width, src.height).data;
  let x0 = src.width, y0 = src.height, x1 = -1, y1 = -1;
  for (let y = 0; y < src.height; y++) for (let x = 0; x < src.width; x++) {
    if (data[(y * src.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const out = document.createElement('canvas');
  // 端にしっかり色がある＝切れている（影のうっすらした部分は無視）
  const sw = src.width, sh = src.height, A = (x, y) => data[(y * sw + x) * 4 + 3] > 96;
  out.clipped = false;
  for (let x = 0; x < sw && !out.clipped; x++) out.clipped = A(x, 0) || A(x, sh - 1);
  for (let y = 0; y < sh && !out.clipped; y++) out.clipped = A(0, y) || A(sw - 1, y);
  if (x1 < 0) { out.width = exact ? maxW : 2; out.height = exact ? maxH : 2; return out; }
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const sc = Math.min((maxW - margin * 2) / cw, (maxH - margin * 2) / ch);
  const dw = cw * sc, dh = ch * sc;
  out.width = exact ? maxW : Math.min(maxW, Math.ceil((dw + margin * 2) / 2) * 2);
  out.height = exact ? maxH : Math.min(maxH, Math.ceil((dh + margin * 2) / 2) * 2);
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = true; o.imageSmoothingQuality = 'high';
  o.drawImage(src, x0, y0, cw, ch, (out.width - dw) / 2, (out.height - dh) / 2, dw, dh);
  return out;
}
function exportOpts() { return state.exportMode || 'trim'; }
function finalSticker(src) {
  if (exportOpts() === 'trim') return trimToCanvas(src, W, H, MARGIN, false);
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  out.clipped = trimToCanvas(src, 2, 2, 0, true).clipped;
  const o = out.getContext('2d'); o.imageSmoothingQuality = 'high'; o.drawImage(src, 0, 0, W, H);
  return out;
}
const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const workCtx = work.getContext('2d', { willReadFrequently: true });

}

// ===== 動くスタンプ（APNG）書き出し =====
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; }
  return t;
})();
function crc32(u8, from, to) {
  let c = 0xFFFFFFFF;
  for (let i = from; i < to; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// UPNG はループ回数を無限で書くので、acTL チャンクを書き換えて 1〜4回にする
function setApngLoops(buf, loops) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let off = 8;
  while (off + 8 <= u8.length) {
    const len = dv.getUint32(off), type = String.fromCharCode(u8[off + 4], u8[off + 5], u8[off + 6], u8[off + 7]);
    if (type === 'acTL') {
      dv.setUint32(off + 12, loops);
      dv.setUint32(off + 8 + len, crc32(u8, off + 4, off + 8 + len));
      break;
    }
    off += 12 + len;
  }
  return u8;
}
function animFrameCount(A) { return Math.max(2, Math.min(20, Math.round(A.fps * A.dur))); }
// 1スロットをAPNGに。全フレーム共通の切り抜き枠で書き出す
async function renderSlotApng(slot, maxW, maxH, exact) {
  applySlot(slot, true);
  await Promise.all(state.texts.map(ensureFonts));
  await Promise.all(models.map(m => applyNeta(m)));
  await document.fonts.ready;
  syncTexts(true);
  const A = state.anime || defaultAnime();
  const F = animFrameCount(A), dt = A.dur / F;
  const step = ph => {
    for (const m of models) if (m.vrm) applyPose(m);
    applyAnime(ph);
    for (const m of models) if (m.vrm) m.vrm.update(dt);
  };
  for (let k = 0; k < F * 2; k++) step((k % F) / F);   // ゆれものの助走（ループ頭とつながるように）
  const shots = [];
  for (let k = 0; k < F; k++) {
    step(k / F);
    renderer.render(scene, camera);
    compose(workCtx);
    const c = document.createElement('canvas'); c.width = CW; c.height = CH;
    c.getContext('2d').drawImage(work, 0, 0);
    shots.push(c);
  }
  // 全フレームの不透明部分を合わせた枠
  let x0 = CW, y0 = CH, x1 = -1, y1 = -1;
  for (const c of shots) {
    const data = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, CW, CH).data;
    for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
      if (data[(y * CW + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = CW - 1; y1 = CH - 1; }
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1, margin = exact ? 0 : MARGIN;
  const scl = Math.min((maxW - margin * 2) / cw, (maxH - margin * 2) / ch);
  const dw = cw * scl, dh = ch * scl;
  const ow = exact ? maxW : Math.min(maxW, Math.ceil((dw + margin * 2) / 2) * 2);
  const oh = exact ? maxH : Math.min(maxH, Math.ceil((dh + margin * 2) / 2) * 2);
  const out = document.createElement('canvas'); out.width = ow; out.height = oh;
  const o = out.getContext('2d', { willReadFrequently: true });
  o.imageSmoothingQuality = 'high';
  const bufs = [];
  for (const c of shots) {
    o.clearRect(0, 0, ow, oh);
    o.drawImage(c, x0, y0, cw, ch, (ow - dw) / 2, (oh - dh) / 2, dw, dh);
    bufs.push(o.getImageData(0, 0, ow, oh).data.buffer.slice(0));
  }
  const delays = Array(F).fill(Math.round(1000 * A.dur / F));
  // 256色に減色して 300KB 以下を狙う（LINEの上限）
  let png = UPNG.encode(bufs, ow, oh, 256, delays);
  if (png.byteLength > 290 * 1024) png = UPNG.encode(bufs, ow, oh, 128, delays);
  if (png.byteLength > 290 * 1024) png = UPNG.encode(bufs, ow, oh, 64, delays);
  return setApngLoops(png, Math.max(1, Math.min(4, A.loops)));
}
async function exportApngCurrent() {
  await withBusy(async () => {
    showProgress('APNG書き出し中…');
    const u8 = await renderSlotApng(state.slots[state.active], 320, 270, false);
    download(new Blob([u8], { type: 'image/png' }), `${String(state.active + 1).padStart(2, '0')}.png`);

  });
}

}

function el(tag, attrs = {}, ...kids) {

}
function sec(title, ...kids) { return el('div', { class: 'sec' }, title ? el('h3', {}, title) : null, ...kids); }
function slider(label, get, set, min, max, step = 1, fmt = v => v, lazy = false) {
  const val = el('span', { class: 'val' }, String(fmt(get())));
  const inp = el('input', { type: 'range', min, max, step });
  inp.value = get();
  // lazy：重い処理（形の作り直し）は手を離したときだけ
  const apply = () => { set(+inp.value); markDirty(); };
  inp.oninput = () => { val.textContent = fmt(+inp.value); if (!lazy) apply(); };
  if (lazy) inp.onchange = apply;
  inp.ondblclick = () => { inp.value = Math.min(max, Math.max(min, 0)); inp.oninput(); };
  return el('div', { class: 'row' }, el('label', {}, label), inp, val);
}

}

    const [v, t] = Array.isArray(o) ? o : [o, o]; s.append(el('option', { value: v }, t));
  }
  s.value = get();

  return el('div', { class: 'row' }, el('label', {}, label), s);
}

function mirrorPose(p) {
  const out = {};
  for (const [k, v] of Object.entries(p)) {
    if (k === '_gripL') { out._gripR = v; continue; }
    if (k === '_gripR') { out._gripL = v; continue; }
    const nk = k.startsWith('left') ? 'right' + k.slice(4) : k.startsWith('right') ? 'left' + k.slice(5) : k;
    out[nk] = [v[0], -v[1], -v[2]];
  }
  return out;
}

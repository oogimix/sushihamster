name: Build Gallery
on:
  push:            # まずは全部のpushで走らせる（原因特定のため）
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Print tree (before)
        run: |
          echo "== ls -R =="
          ls -R
          echo "== find asset/gallery =="
          find asset -maxdepth 3 -type d -name gallery -print -exec ls -l {} \; || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm i --no-audit --no-fund sharp fast-glob image-size

      - name: Run builder
        run: node tools/build-gallery.mjs

      - name: Print tree (after)
        run: |
          echo "== after build =="
          ls -R asset/gallery || true

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push result
        run: |
          git add asset/gallery/images.json asset/gallery/thumb || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(gallery): auto-build images.json & thumbs"
          git push

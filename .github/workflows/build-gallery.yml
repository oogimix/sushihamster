name: Build Gallery (no thumbs)
on:
  push:
    branches: [ main ]
    paths:
      - 'asset/gallery/original/**'
      - 'tools/build-gallery.mjs'
      - '.github/workflows/build-gallery.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make sure folders exist
        run: |
          mkdir -p asset/gallery
      - name: Run builder
        run: node tools/build-gallery.mjs
      - name: Commit & push result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add asset/gallery/images.json
          git commit -m "chore(gallery): auto-build images.json (no thumbs)" || echo "No changes"
          git push

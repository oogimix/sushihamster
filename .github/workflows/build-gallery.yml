name: Build Gallery
on:
  push:
    branches: [ main ]   # ← 既定ブランチが main 以外なら変えてOK
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Show tree (before)
        run: |
          echo "== tree (top) ==" && ls -la
          echo "== tree asset/gallery ==" && ls -la asset/gallery || true
          echo "== tree asset/gallery/original ==" && ls -la asset/gallery/original || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm i --no-audit --no-fund sharp fast-glob image-size

      - name: Build thumbs & images.json (robust)
        run: node tools/build-gallery.mjs

      - name: Show tree (after)
        run: |
          echo "== after build ==" && ls -la asset/gallery || true
          echo "== thumbs ==" && ls -la asset/gallery/thumb || true
          echo "== images.json ==" && wc -c asset/gallery/images.json || true
          echo "----"
          cat asset/gallery/images.json || true

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push result
        run: |
          git add asset/gallery/images.json asset/gallery/thumb || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(gallery): auto-build images.json & thumbs"
          git push

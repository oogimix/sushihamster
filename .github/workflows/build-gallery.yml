name: Build Gallery
on:
  push:
    paths:
      - 'asset/gallery/original/**'
      - 'tools/build-gallery.mjs'
      - '.github/workflows/build-gallery.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        run: npm i sharp fast-glob image-size
      - name: Build images.json & thumbs
        run: node tools/build-gallery.mjs
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add asset/gallery/images.json asset/gallery/thumb/**
          git commit -m "chore(gallery): auto-build images.json & thumbs" || echo "No changes"
          git push

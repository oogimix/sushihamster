name: Build Gallery

on:
  push:
    paths:
      - 'asset/gallery/original/**'
      - 'tools/build-gallery.mjs'
      - '.github/workflows/build-gallery.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install sharp fs-extra

      - name: Build Gallery
        run: node tools/build-gallery.mjs

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add asset/gallery/images.json asset/gallery/thumb
          git commit -m "Update gallery JSON & thumbnails [skip ci]" || echo "No changes to commit"
          git push

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>お絵かき掲示板 | sushihamster</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/bbs.css" />
</head>
<body>
  <div class="oekaki-wrap">
    <h2>🎨 お絵かき掲示板</h2>

    <div class="draw-panel">
      <h3>✏️ お絵かきして投稿しよう！</h3>
      <div class="oekaki-tools">
        <label>🖊 色:</label>
        <input type="color" id="color-picker" class="color-picker" value="#333333" title="色を選択" />
        <label>太さ:</label>
        <input type="range" id="size-slider" class="size-slider" min="1" max="40" value="6" />
        <span id="size-label" style="font-size:.85rem;color:#888;min-width:24px">6</span>
        <button class="tool-btn active" id="btn-pen">🖊 ペン</button>
        <button class="tool-btn"        id="btn-eraser">🧹 消しゴム</button>
      </div>
      <div id="canvas-wrap">
        <canvas id="main-canvas" width="700" height="420"></canvas>
      </div>
      <div class="oekaki-submit-form">
        <input type="text"     id="inp-name"    placeholder="名前（必須・20文字以内）"     maxlength="20" />
        <input type="text"     id="inp-comment" placeholder="一言コメント（任意・40文字）" maxlength="40" />
        <input type="password" id="inp-delkey"  placeholder="削除キー（任意）"             maxlength="20" />
        <button class="clear-btn"       id="clear-btn">🗑 クリア</button>
        <button class="bbs-submit-btn"  id="post-btn">投稿する 🐹</button>
      </div>
    </div>

    <div class="gallery-section">
      <h3>🖼️ みんなの絵</h3>
      <div id="gallery-list"><p class="bbs-loading">読み込み中...</p></div>
    </div>
  </div>

  <div class="bbs-lightbox" id="lightbox">
    <button class="lb-close" id="lb-close">×</button>
    <img id="lb-img" src="" alt="" />
    <div class="lb-info">
      <div class="lb-name"    id="lb-name"></div>
      <div class="lb-comment" id="lb-comment"></div>
    </div>
  </div>

  <div class="bbs-del-overlay" id="del-overlay">
    <div class="bbs-del-box">
      <h4>🗑️ 削除しますか？</h4>
      <p>投稿時に設定した削除キーを入力してください（設定なしの場合はそのまま確認）</p>
      <input type="password" id="del-key-input" placeholder="削除キー" />
      <div class="btn-row">
        <button class="bbs-btn-cancel"  id="del-cancel">キャンセル</button>
        <button class="bbs-btn-confirm" id="del-confirm">削除する</button>
      </div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>sushihamster logo maker</title>
<meta name="description" content="Make your own 3D sushihamster logo: pick colors and finishes, watch it move to the beat, and download a transparent PNG.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1Q18 14 31 16Q18 18 16 31Q14 18 1 16Q14 14 16 1Z' fill='%23316cd4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* layout: the stage owns the screen (the logo on its own sky), one quiet dock beside it (below it on phones) with a fixed download bar */
:root{
  --sky:#a3bbd3; --sky-deep:#8fabc8; --cobalt:#316cd4; --ink:#102060; --paper:#eef3fa; --white:#ffffff; --candy:#ff8cc6;
  --ink-soft:rgba(16,32,96,.62); --line:rgba(16,32,96,.18);
  --f-display:"Unbounded","Arial Rounded MT Bold","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--candy);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;position:relative;z-index:2}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.wm{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--cobalt);white-space:nowrap}
.sub{font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--ink)}
.top .grow{flex:1}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 12px;font-weight:700;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--white)}

.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px}
.stage{position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
/* the one flourish: a big thin orbit, the logo's ring echoed across the page */
.orbit{position:absolute;left:-10%;top:-20%;width:120%;height:140%;pointer-events:none;z-index:0}
.orbit ellipse{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.5}
#stage{z-index:1}
.hud{position:absolute;left:18px;bottom:18px;z-index:2;display:flex;align-items:center;gap:10px}
.beats{display:flex;gap:6px}
.beats i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.beats i.on{background:var(--ink)}
.beats i.on:first-child{background:var(--candy);border-color:var(--candy)}
.ghost{border:2px solid var(--ink);background:rgba(255,255,255,.55);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.ghost:hover{background:var(--white)}
.pngfab{display:none;position:absolute;right:12px;bottom:12px;z-index:2;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;background:var(--cobalt);color:var(--white);font-family:var(--f-display);font-weight:700;font-size:13px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 var(--ink)}
.pngfab svg{width:13px;height:13px}
.pngfab:disabled{opacity:.7}
.hint{position:absolute;right:18px;bottom:22px;z-index:2;font-size:12.5px;color:var(--ink-soft);margin:0}

.dock{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper);border-left:2px solid var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--ink)}
.tabs button{border:0;background:transparent;padding:14px 4px 12px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink-soft);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cobalt)}
.panes{overflow-y:auto;padding:18px 20px 24px;scrollbar-width:thin}
.pane{display:grid;gap:20px}
.grp{display:grid;gap:9px}
.lbl{font-weight:700;font-size:13.5px;margin:0}
.lbl small{font-weight:500;color:var(--ink-soft);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:var(--white);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;line-height:1.2;min-height:38px}
.chip:hover{background:#f6f9ff}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--white);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.fin{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fin .chip{padding:7px 4px;font-size:12.5px}
.sws{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid var(--ink);background:var(--sw);position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--cobalt)}
.sw.same{background:var(--white);font-size:10.5px;font-weight:700}
.sw.custom{background:conic-gradient(#ff6aa8,#ffd54f,#5ee0b5,#5b8ff0,#b37bff,#ff6aa8)}
.sw.custom.set{background:var(--sw)}
.sw.custom::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:var(--white);font-weight:700;font-size:17px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.sw.custom{display:block;cursor:pointer;overflow:hidden}
.picker{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);opacity:0;border:0;padding:0;margin:0;cursor:pointer;z-index:1}
.sw.custom:focus-within{outline:3px solid var(--candy);outline-offset:2px}
.bpm{display:flex;align-items:center;gap:8px}
.bpm input[type=number]{width:76px;border:2px solid var(--ink);border-radius:12px;padding:6px 8px;font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;background:var(--white);color:var(--ink)}
.bpm input[type=range]{flex:1;min-width:0;accent-color:var(--cobalt)}
.note{font-size:12.5px;color:var(--ink-soft);margin:0}

.export{border-top:2px solid var(--ink);padding:14px 20px 16px;display:grid;gap:10px;background:var(--paper)}
.exrow{display:flex;gap:8px;flex-wrap:wrap}
.exrow .chip{min-height:34px;padding:5px 12px;font-size:12.5px}
.dl{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;padding:15px 18px;background:var(--cobalt);color:var(--white);font-family:var(--f-display);font-weight:700;font-size:16px;box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 4px 0 var(--ink)}
.dl:active{transform:translateY(2px);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 2px 0 var(--ink)}
.dl:disabled{opacity:.7;cursor:progress}
.dl svg{width:18px;height:18px;flex:none}

.modal{position:fixed;inset:0;z-index:20;background:rgba(16,32,96,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:16px;width:min(900px,100%);max-height:100%;overflow:auto;display:grid;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:17px}
.checker{border-radius:14px;overflow:hidden;border:2px solid var(--line);background-color:#fff;
  background-image:linear-gradient(45deg,#dfe7f2 25%,transparent 25%),linear-gradient(-45deg,#dfe7f2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dfe7f2 75%),linear-gradient(-45deg,transparent 75%,#dfe7f2 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.checker img{display:block;width:100%;height:auto}
.sheet .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet .row .grow{flex:1}
.sheet .dl{width:auto;padding:12px 22px;font-size:14px}

@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .top{padding:12px 16px}
  .wm{font-size:19px}
  .main{grid-template-columns:1fr}
  .stage{height:min(40vh,380px);position:sticky;top:0;z-index:3;background:var(--sky);border-bottom:2px solid var(--ink)}
  .dock{border-top:0}
  .hud{left:12px;bottom:12px}
  .ghost{padding:5px 11px;font-size:12px}
  .dock{border-left:0}
  .panes{overflow:visible;padding:16px 16px 8px}
  .pngfab{display:flex}
  .export{position:static;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:4;gap:8px}
  .exrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .exrow .chips{flex-wrap:nowrap}
  .exrow .chip{white-space:nowrap}
  .dl{padding:12px 16px;font-size:15px}
  .hint{display:none}
  .fin{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:380px){ .sub{display:none} .fin{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion:reduce){ .dl:active{transform:none} }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="wm">sushihamster</span><span class="sub" data-i18n="sub">logo maker</span></div>
    <div class="grow"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
    </div>
  </header>

  <div class="main">
    <section class="stage" aria-label="Preview">
      <svg class="orbit" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="500" cy="300" rx="470" ry="150" transform="rotate(-3 500 300)"/></svg>
      <div id="stage"></div>
      <div class="hud">
        <div class="beats" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <button class="ghost" id="play" type="button" data-i18n="pause">Pause</button>
        <button class="ghost" id="home" type="button" data-i18n="front">Face front</button>
      </div>
      <button class="pngfab" id="shoot2" type="button"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1Q18 14 31 16Q18 18 16 31Q14 18 1 16Q14 14 16 1Z" fill="currentColor"/></svg><span data-i18n="makeShort">Create</span></button>
      <p class="hint" data-i18n="hint">Drag to turn it. Pinch or scroll to zoom.</p>
    </section>

    <aside class="dock">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="style" aria-selected="true" data-i18n="tStyle">Style</button>
        <button type="button" role="tab" data-tab="color" aria-selected="false" data-i18n="tColor">Color</button>
        <button type="button" role="tab" data-tab="motion" aria-selected="false" data-i18n="tMotion">Motion</button>
      </div>

      <div class="panes">
        <div class="pane" data-pane="style">
          <div class="grp"><p class="lbl" data-i18n="design">Shape</p>
            <div class="chips" data-set="style">
              <button class="chip" type="button" data-v="framed" data-i18n="framed">Badge</button>
              <button class="chip" type="button" data-v="simple" data-i18n="simple">Letters only</button>
            </div></div>
          <div class="grp"><p class="lbl" data-i18n="finish">Finish</p>
            <div class="fin" data-set="material">
              <button class="chip" type="button" data-v="puffy" data-i18n="puffy">Puffy</button>
              <button class="chip" type="button" data-v="gummy" data-i18n="gummy">Gummy</button>
              <button class="chip" type="button" data-v="jelly" data-i18n="jelly">Jelly</button>
              <button class="chip" type="button" data-v="clear" data-i18n="clear">Clear</button>
              <button class="chip" type="button" data-v="skeleton" data-i18n="skeleton">Translucent</button>
              <button class="chip" type="button" data-v="glass" data-i18n="glass">Glass</button>
              <button class="chip" type="button" data-v="chrome" data-i18n="chrome">Chrome</button>
              <button class="chip" type="button" data-v="matte" data-i18n="matte">Matte</button>
            </div></div>
          <div class="grp"><p class="lbl" data-i18n="bg">Preview background <small data-i18n="bgNote">not in the download</small></p>
            <div class="chips" data-set="bg">
              <button class="chip" type="button" data-v="sky" data-i18n="bgSky">Sky</button>
              <button class="chip" type="button" data-v="white" data-i18n="bgWhite">White</button>
              <button class="chip" type="button" data-v="night" data-i18n="bgNight">Night</button>
              <button class="chip" type="button" data-v="green" data-i18n="bgGreen">Green screen</button>
            </div></div>
        </div>

        <div class="pane" data-pane="color" hidden>
          <div class="grp"><p class="lbl" data-i18n="cLetter">Letters</p><div class="sws" data-color="letter"></div></div>
          <div class="grp" data-only="framed"><p class="lbl" data-i18n="cFrame">Badge</p><div class="sws" data-color="frame"></div></div>
          <div class="grp"><p class="lbl" data-i18n="cHoop">Ring</p><div class="sws" data-color="hoop"></div></div>
          <div class="grp"><p class="lbl" data-i18n="cSparkle">Sparkles</p><div class="sws" data-color="sparkle"></div></div>
          <div class="grp"><p class="lbl" data-i18n="cHeart">Heart</p><div class="sws" data-color="heart"></div></div>
        </div>

        <div class="pane" data-pane="motion" hidden>
          <div class="grp"><p class="lbl" data-i18n="tempo">Tempo <small>BPM</small></p>
            <div class="bpm"><input type="number" id="bpm" min="40" max="220" value="120" aria-label="BPM"><input type="range" id="bpmRange" min="60" max="200" value="120" aria-label="BPM"><button class="chip" id="tap" type="button" data-i18n="tap">Tap</button></div>
            <p class="note" data-i18n="tapNote">Tap along with your song to match its tempo.</p></div>
          <div class="grp"><p class="lbl" data-i18n="ring">Ring</p>
            <div class="chips" data-set="ringBars">
              <button class="chip" type="button" data-v="1" data-i18n="bar1">1 turn per bar</button>
              <button class="chip" type="button" data-v="2" data-i18n="bar2">1 turn per 2 bars</button>
            </div>
            <div class="chips" data-set="ringDir">
              <button class="chip" type="button" data-v="-1" data-i18n="dirB">Clockwise</button>
              <button class="chip" type="button" data-v="1" data-i18n="dirA">Counterclockwise</button>
            </div></div>
          <div class="grp"><p class="lbl" data-i18n="sparkles">Sparkles</p>
            <div class="chips" data-set="sparkleRide">
              <button class="chip" type="button" data-v="true" data-i18n="ride">Ride the ring</button>
              <button class="chip" type="button" data-v="false" data-i18n="fixed">Stay put</button>
            </div></div>
          <div class="grp"><p class="lbl" data-i18n="heart">Heart</p>
            <div class="chips" data-set="heartBounce">
              <button class="chip" type="button" data-v="false" data-i18n="still">Still</button>
              <button class="chip" type="button" data-v="true" data-i18n="bounce">Hop on the beat</button>
            </div></div>
          
        </div>
      </div>

      <div class="export">
        <div class="exrow">
          <div class="chips" data-set="shotBg">
            <button class="chip" type="button" data-v="clear" data-i18n="transparent">Transparent</button>
            <button class="chip" type="button" data-v="keep" data-i18n="withBg">With background</button>
          </div>
          <div class="chips" data-set="shotSize">
            <button class="chip" type="button" data-v="2048">2048 px</button>
            <button class="chip" type="button" data-v="4096">4096 px</button>
          </div>
        </div>
        <button class="dl" id="shoot" type="button"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1Q18 14 31 16Q18 18 16 31Q14 18 1 16Q14 14 16 1Z" fill="currentColor"/></svg><span data-i18n="make">Create</span></button>
      </div>
    </aside>
  </div>
</div>

<div class="modal" id="shotModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shotTitle">
    <h2 id="shotTitle" data-i18n="ready">Your logo is ready</h2>
    <div class="checker"><img id="shotImg" alt="Your sushihamster logo"></div>
    <div class="row">
      <span class="note" id="shotInfo"></span>
      <span class="grow"></span>
      <button class="chip" id="shotClose" type="button" data-i18n="close">Close</button>
      <button class="dl" id="shotSave" type="button" data-i18n="save">Save image</button>
    </div>
    <p class="note" id="shotNote" role="status"></p>
  </div>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOVELY CARD</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background: #F5A8C0;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 12px;
}
.card-wrap {
  position: relative;
  width: 100%;
  max-width: 560px;
}
.card-img {
  width: 100%;
  display: block;
  border-radius: 14px;
  user-select: none;
  pointer-events: none;
}
/* Stamp overlay grid */
.stamps-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.stamp-slot {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 11%;
  aspect-ratio: 1;
  border-radius: 50%;
  cursor: pointer;
  pointer-events: all;
  user-select: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.001);
  transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1);
}
.stamp-slot:hover { background: rgba(255,182,193,0.3); }
.stamp-slot:active { transform: translate(-50%,-50%) scale(0.85); }

.stamp-mark {
  display: none;
  font-size: clamp(22px, 6vw, 42px);
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  animation: none;
  line-height: 1;
}
.stamp-slot.stamped {
  background: rgba(255,182,193,0.55);
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(214,53,128,0.3);
}
.stamp-slot.stamped .stamp-mark { display: flex; align-items: center; justify-content: center; }
.stamp-slot.just-stamped .stamp-mark {
  animation: stampIn 0.45s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
}
@keyframes stampIn {
  0%   { transform: scale(0) rotate(-25deg); opacity:0; }
  60%  { transform: scale(1.3) rotate(6deg); opacity:1; }
  100% { transform: scale(1) rotate(-2deg); opacity:1; }
}
/* coupon */
.coupon-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(214,53,128,0.6);
  backdrop-filter:blur(6px);
  z-index:500; align-items:center; justify-content:center; padding:20px;
}
.coupon-overlay.show { display:flex; }
.coupon {
  background:#FFF5F8; border-radius:28px;
  padding:36px 28px 28px; text-align:center;
  max-width:300px; width:100%;
  border:3px dashed #FF85AF;
  animation:couponPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
@keyframes couponPop {
  0%  { transform:scale(0.4) rotate(-6deg); opacity:0; }
  70% { transform:scale(1.04) rotate(1deg); }
  100%{ transform:scale(1) rotate(0deg); opacity:1; }
}
.coupon-ice   { font-size:70px; margin-bottom:6px; display:block; }
.coupon-title { font-size:22px; font-weight:900; color:#D63580; margin-bottom:6px; font-family:'Arial Black',sans-serif; }
.coupon-sub   { font-size:13px; color:#FF85AF; line-height:1.8; margin-bottom:16px; }
.coupon-badge {
  background:linear-gradient(135deg,#FF85AF,#D63580);
  color:white; border-radius:14px; padding:14px;
  margin-bottom:18px; font-size:13px; font-weight:700; line-height:1.6;
}
.btn {
  display:block; width:100%; padding:13px;
  border-radius:50px; font-size:15px; font-weight:700;
  cursor:pointer; font-family:inherit; border:none;
  margin-bottom:10px; transition:transform 0.1s;
}
.btn:active { transform:scale(0.96); }
.btn-primary   { background:#D63580; color:white; }
.btn-secondary { background:#FFD6E7; color:#D63580; }
.reset-wrap { margin-top:8px; text-align:center; }
.reset-btn {
  background:none; border:none; color:rgba(255,255,255,0.6);
  font-size:10px; cursor:pointer; text-decoration:underline; font-family:inherit;
}
.particles { position:fixed; inset:0; pointer-events:none; z-index:600; }
.particle { position:absolute; font-size:18px; animation:floatUp 1.4s ease-out forwards; }
@keyframes floatUp {
  0%  { transform:translateY(0) scale(1); opacity:1; }
  100%{ transform:translateY(-130px) scale(0.3); opacity:0; }
}
</style>
</head>

  <div class="stamps-overlay" id="stampsOverlay"></div>
</div>

<div class="reset-wrap">
  <button class="reset-btn" onclick="confirmReset()">リセット</button>
</div>

<div class="coupon-overlay" id="couponOverlay">
  <div class="coupon">
    <span class="coupon-ice">🍦</span>
    <div class="coupon-title">アイス引換券！</div>
    <div class="coupon-sub">スタンプ10個達成！<br>おめでとう🎉💕</div>
    <div class="coupon-badge">この画面を見せてね👆<br>好きなアイスを１つ<br>買ってもらえます！</div>
    <button class="btn btn-primary"   onclick="useCoupon()">🛒 引き換えた！（リセット）</button>
    <button class="btn btn-secondary" onclick="closeCoupon()">💌 あとで使う</button>
  </div>
</div>
<div class="particles" id="particles"></div>

<script>
const EMOJIS = ['🛁','🚿','🧼','🫧','🌸','💕','✨','🐧','🍀','💗'];
const PARTS  = ['💕','💗','✨','🌸','💖','⭐','🎀'];

// Storage with fallback
let stamps = new Array(10).fill(null);
try {
  const saved = JSON.parse(localStorage.getItem('lovelyCard_v5') || 'null');
  if (Array.isArray(saved) && saved.length === 10) stamps = saved;
} catch(e) {}

function save() {
  try { localStorage.setItem('lovelyCard_v5', JSON.stringify(stamps)); } catch(e) {}
}

// Circle center positions measured from image (1075×650px)
// x: 32.1%, 46.3%, 60.5%, 74.5%, 88.8%
// y: row1=48.5%, row2=66.9%
const POS = [
  {x:'32.1%', y:'44%'}, {x:'46.3%', y:'44%'}, {x:'60.5%', y:'44%'},
  {x:'74.5%', y:'44%'}, {x:'88.8%', y:'44%'},
  {x:'32.1%', y:'66.9%'}, {x:'46.3%', y:'66.9%'}, {x:'60.5%', y:'66.9%'},
  {x:'74.5%', y:'66.9%'}, {x:'88.8%', y:'66.9%'}
];

function render() {
  const grid = document.getElementById('stampsOverlay');
  grid.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const slot = document.createElement('div');
    slot.className = 'stamp-slot' + (stamps[i] ? ' stamped' : '');
    slot.dataset.index = i;
    slot.style.left = POS[i].x;
    slot.style.top  = POS[i].y;
    slot.innerHTML = '<span class="stamp-mark">' + (stamps[i] || '') + '</span>';
    slot.addEventListener('click', function() { tap(parseInt(this.dataset.index)); });
    grid.appendChild(slot);
  }
}

function tap(i) {
  if (stamps[i]) return;  // already stamped
  stamps[i] = EMOJIS[i];
  save();

  // Update just this slot without full re-render
  const slots = document.querySelectorAll('.stamp-slot');
  const slot = slots[i];
  slot.classList.add('stamped');
  const mark = slot.querySelector('.stamp-mark');
  mark.textContent = stamps[i];
  slot.classList.add('just-stamped');
  setTimeout(() => slot.classList.remove('just-stamped'), 500);

  spawnParticles();

  const count = stamps.filter(Boolean).length;
  if (count === 10) {
    setTimeout(() => document.getElementById('couponOverlay').classList.add('show'), 700);
  }
}

function spawnParticles() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = PARTS[Math.floor(Math.random() * PARTS.length)];
      p.style.left = (10 + Math.random() * 80) + 'vw';
      p.style.top  = (20 + Math.random() * 55) + 'vh';
      c.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }, i * 90);
  }
}

function closeCoupon() { document.getElementById('couponOverlay').classList.remove('show'); }

function useCoupon() {
  if (confirm('アイスを引き換えましたか？\nスタンプをリセットします🍦')) {
    stamps = new Array(10).fill(null);
    save(); render(); closeCoupon();
  }
}

function confirmReset() {
  if (confirm('スタンプをすべてリセットしますか？')) {
    stamps = new Array(10).fill(null);
    save(); render();
  }
}

if (stamps.filter(Boolean).length === 10) {
  setTimeout(() => document.getElementById('couponOverlay').classList.add('show'), 400);
}

render();
</script>
